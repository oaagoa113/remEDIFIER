name: Build remEDIFIER

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2

      - name: Build
        run: |
          cd libcomhelper
          qmake
          make
          cd ..
          dotnet publish remEDIFIER/remEDIFIER.csproj
          
          # Копируем библиотеки comhelper под обоими именами, чтобы избежать DllNotFoundException
          cp libcomhelper/libcomhelper.so remEDIFIER/bin/Release/net9.0/linux-x64/publish/libcomhelper.so
          cp libcomhelper/libcomhelper.so remEDIFIER/bin/Release/net9.0/linux-x64/publish/comhelper.so
          
          # Копируем абсолютно ВСЕ библиотеки Qt5, чтобы гарантировать запуск
          cp -P $QT_ROOT_DIR/lib/libQt5*.so* remEDIFIER/bin/Release/net9.0/linux-x64/publish/
          
          # Копируем библиотеки ICU (libicu*.so.56), которые идут в комплекте с Qt, 
          # чтобы приложение запускалось на любых современных дистрибутивах Linux
          cp -P $QT_ROOT_DIR/lib/libicu*.so* remEDIFIER/bin/Release/net9.0/linux-x64/publish/ || true
          
          rm -f remEDIFIER/bin/Release/net9.0/linux-x64/publish/remEDIFIER.dbg
          rm -f remEDIFIER/bin/Release/net9.0/linux-x64/publish/readme.md

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: remEDIFIER/bin/Release/net9.0/linux-x64/publish/
